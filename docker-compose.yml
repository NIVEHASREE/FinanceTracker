version: '3'

services:
  mongodb:
    image: mongo
    container_name: mongodb
    ports:
      - "27017:27017"

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      - MONGO_URL=mongodb://mongodb:27017/finance

  frontend:
    build: ./frontend/finance
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
